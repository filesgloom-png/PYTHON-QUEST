name: PYTHON QUEST CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s manifest.json
          test -s sw.js
          test -s README.md
          test -s .github/workflows/ci.yml
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json > /dev/null
      - name: Check HTML document markers
        run: |
          grep -q '<!doctype html>' index.html
          grep -q 'lang="ru"' index.html
          grep -q 'loadPyodide' index.html
          grep -q 'PYTHON QUEST' index.html
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "Inline JavaScript was not found"
          Path("/tmp/app.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/app.js
          node --check sw.js
  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4